name: debug-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :gkd-android:assembleGkdDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gkd-ningguang-debug-apk
          path: gkd-android/build/outputs/apk/gkd/debug/*.apk
